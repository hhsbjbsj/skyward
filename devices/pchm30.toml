# OPPO A11x (PCHM30), SM6125 / trinket, non-A/B static partitions.

[device]
codename = "pchm30"
brand = "OPPO"
model = "OPPO A11x"
ab = false
soc = { hans = "骁龙®665移动平台", hant = "Snapdragon® 665 行動平台", en = "Snapdragon® 665 Mobile Platform" }
os_version_prop = "ro.build.display.id"

[display]
width = 720
height = 1600
density = 320
diagonal = 6.5
# ColorOS kernel display driver requires waking the DSI panel node after unblanking.
writes = [{ path = "/sys/kernel/oppo_display/notify_panel_blank", value = "1" }]

# Firmware images for QSEE/TrustZone apps live on the modem partition,
# mounted at /vendor/firmware_mnt as declared in /vendor/etc/fstab.qcom.
[firmware]
partition = "modem"

# Persist holds QSEE/RPMB/calibration state (/mnt/vendor/persist); cache holds
# ColorOS's /cache/runtime.prop where prop.default symlinks.
[partitions]
mounted = ["persist", "cache"]

# Ramdisk hwservicemanager is the HIDL context manager (PT_INTERP
# /system/bin/linker64). Stock init starts it only from
# enable.qseecomd.service, which the stock recovery binary sets and this
# recovery does not. It has to be up before any later program is waited on:
# a vendor qseecomd that is missing or never becomes ready used to return
# first, and Keymaster's lookup then found nobody on /dev/hwbinder.
[[service]]
path = "/system/bin/hwservicemanager"
libraries = ["/system/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The ramdisk's qseecomd, not the installed vendor's. It sets
# vendor.sys.listeners.registered and serves TrustZone storage/RPMB before
# Keymaster starts. libQSEEComAPI.so and libdrmfs.so are in /system/lib64.
[[service]]
path = "/system/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The ramdisk's Keymaster 4.0, the program stock init calls keymaster-4-0.
# libqtikeymaster4.so is in /system/lib64. The installed system is Android 16
# and does not ship this HIDL HAL under /vendor/bin/hw.
[[service]]
path = "/system/bin/android.hardware.keymaster@4.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@4.0::IKeymasterDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# Hardware-backed Gatekeeper 1.0 HAL for PIN/pattern/password verification.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "oppostanvbk", "oppodycnvbk", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fpc", "vendor/goodix"]

[wipe]
logs = [
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]

[stock]
version = "PCHM30_11_F.12"
package = "https://github.com/hhsbjbsj/skyward/releases/download/stock-pchm30/pchm30-stock-recovery.img.gz"
recovery = "bcbfddea46590482ed533cb3438baaadd9201eaa35855b35fa871532ef6d3cc7"
# PCHM30 has a 64 MiB recovery partition; its stock kernel enables CONFIG_RD_LZMA=y
# and stock ColorOS/realmeUI UI fallback fonts under res/*/ttf are unused once
# Skyward replaces system/bin/recovery.
ramdisk_compression = "lzma"
prune = ["res/ColorOS/ttf", "res/realmeUI/ttf"]
